name: Keep Streamlit app awake

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) so Streamlit Cloud
    # always sees fresh browser traffic and never auto-hibernates.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  wake-and-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL || 'https://company-valuation.streamlit.app/' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install chromium --with-deps

      - name: Visit Streamlit app & wake if sleeping
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          url = os.environ["STREAMLIT_APP_URL"].strip()
          print(f"[keep-alive] Target URL: {url}")

          WAKE_SELECTORS = [
              'button[data-testid="wakeup-button-viewer"]',
              'button:has-text("Yes, get this app back up!")',
              'button:has-text("get this app back up")',
              'button:has-text("Wake")',
          ]
          APP_READY_SELECTORS = [
              '[data-testid="stAppViewContainer"]',
              '.terminal-bar',
              '[data-testid="stSidebar"]',
          ]

          def find_wake_button(page):
              for frame in [page.main_frame, *page.frames]:
                  for sel in WAKE_SELECTORS:
                      try:
                          loc = frame.locator(sel).first
                          if loc.is_visible(timeout=800):
                              return loc
                      except Exception:
                          pass
              return None

          def is_app_rendered(page):
              for frame in [page.main_frame, *page.frames]:
                  for sel in APP_READY_SELECTORS:
                      try:
                          if frame.locator(sel).first.is_visible(timeout=1500):
                              return True
                      except Exception:
                          pass
              return False

          last_err = None
          for attempt in range(1, 3):
              print(f"[keep-alive] Attempt {attempt}/2...")
              try:
                  with sync_playwright() as p:
                      browser = p.chromium.launch(headless=True)
                      context = browser.new_context(
                          viewport={"width": 1280, "height": 800},
                          user_agent=(
                              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
                          ),
                      )
                      page = context.new_page()
                      resp = page.goto(url, wait_until="domcontentloaded", timeout=60_000)
                      status = resp.status if resp else None
                      print(f"[keep-alive] Initial HTTP status: {status}")

                      # Give the Streamlit shell / wake screen a moment to paint
                      page.wait_for_timeout(5_000)

                      wake_btn = find_wake_button(page)
                      if wake_btn is not None:
                          print("[keep-alive] App was sleeping — clicking wake-up button...")
                          wake_btn.click()
                          # Wait up to 120s for Streamlit Cloud container boot
                          deadline = time.time() + 120
                          while time.time() < deadline:
                              if is_app_rendered(page):
                                  print("[keep-alive] App woke up and rendered successfully.")
                                  break
                              page.wait_for_timeout(4_000)
                      else:
                          print("[keep-alive] No sleep gate detected; waiting for app render...")
                          deadline = time.time() + 45
                          while time.time() < deadline:
                              if is_app_rendered(page):
                                  print("[keep-alive] App is already awake and rendered.")
                                  break
                              page.wait_for_timeout(3_000)

                      rendered = is_app_rendered(page)
                      print(f"[keep-alive] Final rendered={rendered}, title={page.title()!r}")

                      # Hold the WebSocket session briefly and scroll lightly so traffic is recorded
                      try:
                          page.mouse.wheel(0, 240)
                      except Exception:
                          pass
                      page.wait_for_timeout(12_000)
                      browser.close()

                      if rendered or (status and 200 <= status < 400):
                          print("[keep-alive] Completed successfully.")
                          sys.exit(0)
              except Exception as exc:
                  last_err = exc
                  print(f"[keep-alive] Attempt {attempt} failed: {exc}")
                  time.sleep(5)

          print(f"[keep-alive] Failed after retries: {last_err}")
          sys.exit(1)
          PY

      - name: Prevent GitHub Actions 60-day schedule auto-disable
        run: |
          LAST_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          AGE_DAYS=$(( (NOW_TS - LAST_TS) / 86400 ))
          echo "Last commit age: ${AGE_DAYS} days"
          if [ "${AGE_DAYS}" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep GitHub Actions schedule active"
            git push origin HEAD:main
          else
            echo "Repo active within last 45 days; skipping empty commit."
          fi
